name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check:workspace
      - run: bun run lint
      - run: bun run check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Plain Postgres 17 (what RDS runs): the suites create their own throwaway
    # database on this server and never write to `vibbr_ci` itself.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vibbr
          POSTGRES_PASSWORD: vibbr
          POSTGRES_DB: vibbr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibbr -d vibbr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vibbr:vibbr@127.0.0.1:5432/vibbr_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  web:
    name: Web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:frontend
        env:
          EXPO_PUBLIC_OXY_CLIENT_ID: ci-placeholder
